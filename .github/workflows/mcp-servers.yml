name: mcp-servers

on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp-servers.yml'
  pull_request:
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp-servers.yml'
  workflow_dispatch:
    inputs:
      live:
        description: 'Also run read-only live checks against the real marketplaces (needs the <server>-live environment secrets)'
        type: boolean
        default: false
      server:
        description: 'Live check target'
        type: choice
        options: [all, lazada, shopee]
        default: all

permissions:
  contents: read

concurrency:
  group: mcp-servers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.server }} (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        server: [lazada, shopee]
        node: [22, 24]
    defaults:
      run:
        working-directory: mcp/${{ matrix.server }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mcp/${{ matrix.server }}/package-lock.json

      - name: Install
        run: npm ci --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and MCP protocol tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Stdio smoke test (built server)
        run: npm run smoke

  audit:
    name: audit ${{ matrix.server }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        server: [lazada, shopee]
    defaults:
      run:
        working-directory: mcp/${{ matrix.server }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  live:
    # Manual only: real API calls must never run on untrusted pull request code.
    if: github.event_name == 'workflow_dispatch' && inputs.live
    needs: test
    name: live ${{ matrix.server }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        server: [lazada, shopee]
    environment: ${{ matrix.server }}-live
    defaults:
      run:
        working-directory: mcp/${{ matrix.server }}
    steps:
      - name: Select target
        id: target
        working-directory: .
        run: |
          if [ "${{ inputs.server }}" = "all" ] || [ "${{ inputs.server }}" = "${{ matrix.server }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.target.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        if: steps.target.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/${{ matrix.server }}/package-lock.json
      - if: steps.target.outputs.run == 'true'
        run: npm ci --no-fund
      - name: Read-only live check
        if: steps.target.outputs.run == 'true'
        env:
          LAZADA_APP_KEY: ${{ secrets.LAZADA_APP_KEY }}
          LAZADA_APP_SECRET: ${{ secrets.LAZADA_APP_SECRET }}
          LAZADA_ACCESS_TOKEN: ${{ secrets.LAZADA_ACCESS_TOKEN }}
          LAZADA_REFRESH_TOKEN: ${{ secrets.LAZADA_REFRESH_TOKEN }}
          LAZADA_REGION: ${{ vars.LAZADA_REGION || 'MY' }}
          # Shopee rotates refresh tokens on use, so CI only gets a short-lived access
          # token; refreshing here would invalidate the stored secret.
          SHOPEE_PARTNER_ID: ${{ secrets.SHOPEE_PARTNER_ID }}
          SHOPEE_PARTNER_KEY: ${{ secrets.SHOPEE_PARTNER_KEY }}
          SHOPEE_SHOP_ID: ${{ secrets.SHOPEE_SHOP_ID }}
          SHOPEE_ACCESS_TOKEN: ${{ secrets.SHOPEE_ACCESS_TOKEN }}
          SHOPEE_ENV: ${{ vars.SHOPEE_ENV || 'live' }}
        run: |
          set +e
          npm run --silent live-check
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::warning::${{ matrix.server }} live check skipped: ${{ matrix.server }}-live environment secrets are not set"
            exit 0
          fi
          exit $code
