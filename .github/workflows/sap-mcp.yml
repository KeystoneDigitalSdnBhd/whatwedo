name: sap-mcp
on:
  push:
    branches: [main]
    paths: ['mcp/sap/**', '.github/workflows/sap-mcp.yml']
  pull_request:
    paths: ['mcp/sap/**', '.github/workflows/sap-mcp.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r mcp/sap/requirements.txt
      - run: python -m unittest discover -s mcp/sap -p 'test_*.py'
      - run: python mcp/sap/smoke.py
