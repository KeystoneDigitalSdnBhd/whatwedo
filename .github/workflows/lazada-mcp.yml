name: lazada-mcp

on:
  push:
    branches: [main]
    paths:
      - 'mcp/lazada/**'
      - '.github/workflows/lazada-mcp.yml'
  pull_request:
    paths:
      - 'mcp/lazada/**'
      - '.github/workflows/lazada-mcp.yml'
  workflow_dispatch:
    inputs:
      live:
        description: 'Also run the read-only live check against Lazada (needs the lazada-live environment secrets)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lazada-mcp-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mcp/lazada

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mcp/lazada/package-lock.json

      - name: Install
        run: npm ci --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and MCP protocol tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Stdio smoke test (built server)
        run: npm run smoke

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  live:
    # Manual only: real API calls must never run on untrusted pull request code.
    if: github.event_name == 'workflow_dispatch' && inputs.live
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: lazada-live
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/lazada/package-lock.json
      - run: npm ci --no-fund
      - name: Read-only live check
        env:
          LAZADA_APP_KEY: ${{ secrets.LAZADA_APP_KEY }}
          LAZADA_APP_SECRET: ${{ secrets.LAZADA_APP_SECRET }}
          LAZADA_ACCESS_TOKEN: ${{ secrets.LAZADA_ACCESS_TOKEN }}
          LAZADA_REFRESH_TOKEN: ${{ secrets.LAZADA_REFRESH_TOKEN }}
          LAZADA_REGION: ${{ vars.LAZADA_REGION || 'MY' }}
        run: |
          set +e
          npm run --silent live-check
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::warning::Live check skipped: lazada-live environment secrets are not set"
            exit 0
          fi
          exit $code
