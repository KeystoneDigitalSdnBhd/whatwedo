name: sg-market-intel

on:
  push:
    branches: [main]
    paths:
      - 'products/sg-market-intel/**'
      - '.github/workflows/sg-market-intel.yml'
  pull_request:
    paths:
      - 'products/sg-market-intel/**'
      - '.github/workflows/sg-market-intel.yml'
  workflow_dispatch:
    inputs:
      live:
        description: 'Also read the live data.gov.sg datasets (and Lazada, if the sgmi-live environment has credentials)'
        type: boolean
        default: false
  schedule:
    # Weekly: catch data.gov.sg changing a dataset id, a series name or a table layout.
    - cron: '17 1 * * 1'

permissions:
  contents: read

defaults:
  run:
    working-directory: products/sg-market-intel

concurrency:
  group: sg-market-intel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: products/sg-market-intel/package-lock.json
      - run: npm ci --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high

  live:
    # Never on pull requests: real network calls and, optionally, shop credentials.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sgmi-live
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: products/sg-market-intel/package-lock.json
      - run: npm ci --no-fund
      - name: Live data.gov.sg (and optional Lazada) check
        env:
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}
          LAZADA_APP_KEY: ${{ secrets.LAZADA_APP_KEY }}
          LAZADA_APP_SECRET: ${{ secrets.LAZADA_APP_SECRET }}
          LAZADA_ACCESS_TOKEN: ${{ secrets.LAZADA_ACCESS_TOKEN }}
          LAZADA_REGION: SG
        run: npm run live-check
